name: Lint
on:
  pull_request:
    types:
      - opened
      - edited # Only the title job needs this, other jobs skip it
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read # To checkout
  pull-requests: write # To comment to PRs

jobs:
  actions-lock:
    name: actions-lock
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.2.0
      - run: gh actions-lock --verify

  actionlint:
    name: actionlint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@v1.80.6
        with:
          reporter: github-pr-review

  alex:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-alex@v1.19.0
        with:
          reporter: github-pr-review

  assign-author:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@v3.1.0

  clippy:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3

      - uses: sksat/action-clippy@v1.1.1
        with:
          reporter: github-pr-review

  markdown:
    name: markdown
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-markdownlint@v0.32.0
        with:
          level: warning
          markdownlint_flags: website/docs/**/*.md
          reporter: github-pr-review

  misspell:
    name: misspell
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-misspell@v1.30.3
        with:
          level: warning
          reporter: github-pr-review

  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          disallowScopes: |
            release
            [A-Z]+
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          scopes: |
            .github
            cli
            deps
            other
            web
          types: |
            bump
            chore
            doc
            feat
            fix
