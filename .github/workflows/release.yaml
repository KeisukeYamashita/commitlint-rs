name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # To write to release
  id-token: write # To deploy to GitHub Pages
  pages: write # To deploy to GitHub Pages

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: true
      matrix:
        config:
          # See details fore GitHub Actions runners
          # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest # Cross compile from Apple Silicon
            rust_target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest # (Apple Silicon)
            rust_target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest # Cross compile from x64
            rust_target: aarch64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.config.rust_target }}

      - run: cargo build --package commitlint-rs --release --target ${{ matrix.config.rust_target }}

      - run: tar czvf commitlint-${{ github.ref_name }}-${{ matrix.config.rust_target }}.tar.gz -C target/${{ matrix.config.rust_target }}/release commitlint${{ matrix.config.ext }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: commitlint-${{ matrix.config.rust_target }}
          path: commitlint-${{ github.ref_name }}-${{ matrix.config.rust_target }}.tar.gz
          if-no-files-found: error

  crate:
    runs-on: ubuntu-latest
    environment: crate
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo publish --package commitlint-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build each platform natively (no QEMU emulation) and push by digest,
  # then the docker-merge job assembles the multi-arch manifest.
  docker:
    runs-on: ${{ matrix.os }}
    environment: docker
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=1915keke/commitlint,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    environment: docker
    needs:
      - docker
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: 1915keke/commitlint
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - run: |
          cd /tmp/digests
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do
            refs+=("1915keke/commitlint@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - crate
      - docker-merge
      - schema
      - web
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: commitlint
          pattern: "{commitlint-*,schema.json}"
          merge-multiple: true
      - uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: commitlint/commitlint-*.tar.gz,commitlint/schema.json
          generateReleaseNotes: true

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo run --package schema -- --path schema.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: schema.json
          path: schema.json
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    environment:
      name: web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: withastro/action@v6.1.4
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
