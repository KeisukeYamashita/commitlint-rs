name: CI
on:
  pull_request:
  push:
    branches:
      - main # To save caches that pull requests can restore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0" # Faster builds, smaller caches

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [cli, default]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release
      - run: cargo build --release
      - run: |
          sudo chmod +x target/release/commitlint
          sudo mv target/release/commitlint /usr/local/bin/commitlint
      - uses: mig4/setup-bats@v1.2.0
        with:
          bats-version: 1.9.0
      - run: bats cli/e2e --filter-tags ${{ matrix.tag }}

  schema:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7.0.1
          with:
            persist-credentials: false
        - uses: dtolnay/rust-toolchain@v1
          with:
            toolchain: stable
        - uses: Swatinem/rust-cache@v2.9.3
        - run: cargo run --package schema -- --path schema.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test
